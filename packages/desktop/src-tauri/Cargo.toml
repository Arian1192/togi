[package]
name = "togi-desktop"
version = "0.1.0"
description = "App de escritorio de togi (ADR-010)"
edition = "2021"
publish = false

[lib]
name = "togi_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", default-features = false }

[dependencies]
tauri = { version = "=2.12.5", default-features = false, features = ["wry"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
