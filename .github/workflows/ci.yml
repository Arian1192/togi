name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: ["22.18.0", "24.22.1"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  sandbox-macos:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test "packages/worker/src/**/*.test.ts" "packages/daemon/src/worker/**/*.test.ts" packages/daemon/src/orchestrator/runtime-paths.test.ts "packages/*/src/**/*.srt.test.ts"

  rust:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rustup no instala solo el toolchain de rust-toolchain.toml
      - run: rustup toolchain install 1.99.0 --profile minimal
      # Tauri exige que frontendDist exista al compilar. Se quita en A1b, cuando `pnpm build` lo genere.
      - run: mkdir -p packages/desktop/dist
      - run: cargo test --locked
        working-directory: packages/desktop/src-tauri
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit
        working-directory: packages/desktop/src-tauri
